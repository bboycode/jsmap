# js-secrets.toml
# A trimmed, gitleaks-style secret ruleset for scanning JS bundles
# pulled from webapp pages (inline <script> + external .js files).
#
# Derived from gitleaks' default config, filtered down to rule types
# that realistically show up in client-side JS: cloud API keys,
# payment/SaaS provider keys, tokens, JWTs, and private key headers.
# Server-only rule types (Kubernetes secrets, curl auth headers,
# Nuget/Bundler/Terraform config secrets, .p12 files, etc.) were
# dropped since they never appear in a browser-delivered bundle.
#
# Usage: load this with encoding via BurntSushi/toml, same struct
# shape as gitleaks' own config (see loadGitleaksRules in your Go code).

title = "js-secrets config"

# Every rule below can carry an optional `tags` array.
# Convention used here: rules tagged "link" are URLs/endpoints, not
# secrets — they get filtered into a separate bucket after scanning.
# Any rule with NO tags field is treated as tags = ["secret"] by
# default (see loadGitleaksRules in the Go code), so you don't need
# to annotate every single secret rule by hand.

# ---------------------------------------------------------------------
# Cloud provider keys
# ---------------------------------------------------------------------

[[rules]]
id = "aws-access-token"
description = "AWS Access Key ID"
regex = '''\b((?:A3T[A-Z0-9]|AKIA|ASIA|ABIA|ACCA)[A-Z2-7]{16})\b'''
entropy = 3
keywords = ["a3t", "akia", "asia", "abia", "acca"]

[[rules]]
id = "gcp-api-key"
description = "Google Cloud / Firebase / Maps API Key"
regex = '''\b(AIza[\w-]{35})(?:[\x60'"\s;]|\\[nr]|$)'''
entropy = 4
keywords = ["aiza"]

[[rules]]
id = "firebase-database-url"
description = "Firebase Realtime Database URL (often paired with a leaked API key)"
regex = '''\b[a-z0-9-]+\.firebaseio\.com\b'''
keywords = ["firebaseio.com"]

[[rules]]
id = "cloudflare-api-key"
description = "Cloudflare API Key"
regex = '''(?i)[\w.-]{0,50}?(?:cloudflare)(?:[ \t\w.-]{0,20})[\s'"]{0,3}(?:=|>|:{1,3}=|\|\||:|=>|\?=|,)[\x60'"\s=]{0,5}([a-z0-9_-]{40})(?:[\x60'"\s;]|\\[nr]|$)'''
entropy = 2
keywords = ["cloudflare"]

[[rules]]
id = "digitalocean-pat"
description = "DigitalOcean Personal Access Token"
regex = '''\b(dop_v1_[a-f0-9]{64})(?:[\x60'"\s;]|\\[nr]|$)'''
entropy = 3
keywords = ["dop_v1_"]

[[rules]]
id = "azure-ad-client-secret"
description = "Azure AD Client Secret"
regex = '''(?:^|[\\'"\x60\s>=:(,)])([a-zA-Z0-9_~.]{3}\dQ~[a-zA-Z0-9_~.-]{31,34})(?:$|[\\'"\x60\s<),])'''
entropy = 3
keywords = ["q~"]

# ---------------------------------------------------------------------
# Payments
# ---------------------------------------------------------------------

[[rules]]
id = "stripe-access-token"
description = "Stripe Secret/Restricted Key (live keys are the critical hit — test keys are lower severity)"
regex = '''\b((?:sk|rk)_(?:test|live|prod)_[a-zA-Z0-9]{10,99})(?:[\x60'"\s;]|\\[nr]|$)'''
entropy = 2
keywords = ["sk_test", "sk_live", "sk_prod", "rk_test", "rk_live", "rk_prod"]

[[rules]]
id = "square-access-token"
description = "Square Access Token"
regex = '''\b((?:EAAA|sq0atp-)[\w-]{22,60})(?:[\x60'"\s;]|\\[nr]|$)'''
entropy = 2
keywords = ["sq0atp-", "eaaa"]

[[rules]]
id = "shopify-access-token"
description = "Shopify Access Token"
regex = '''shp(?:at|ca|pa|ss)_[a-fA-F0-9]{32}'''
entropy = 2
keywords = ["shpat_", "shpca_", "shppa_", "shpss_"]

[[rules]]
id = "plaid-client-id"
description = "Plaid Client ID"
regex = '''(?i)[\w.-]{0,50}?(?:plaid)(?:[ \t\w.-]{0,20})[\s'"]{0,3}(?:=|>|:{1,3}=|\|\||:|=>|\?=|,)[\x60'"\s=]{0,5}([a-z0-9]{24})(?:[\x60'"\s;]|\\[nr]|$)'''
entropy = 3.5
keywords = ["plaid"]

# ---------------------------------------------------------------------
# Comms / SaaS platforms commonly wired into frontend JS
# ---------------------------------------------------------------------

[[rules]]
id = "slack-webhook-url"
description = "Slack Incoming Webhook URL"
regex = '''(?:https?://)?hooks.slack.com/(?:services|workflows|triggers)/[A-Za-z0-9+/]{43,56}'''
keywords = ["hooks.slack.com"]

[[rules]]
id = "slack-bot-token"
description = "Slack Bot Token"
regex = '''xoxb-[0-9]{10,13}-[0-9]{10,13}[a-zA-Z0-9-]*'''
entropy = 3
keywords = ["xoxb"]

[[rules]]
id = "twilio-api-key"
description = "Twilio API Key"
regex = '''SK[0-9a-fA-F]{32}'''
entropy = 3
keywords = ["sk"]

[[rules]]
id = "sendgrid-api-token"
description = "SendGrid API Token"
regex = '''\b(SG\.(?i)[a-z0-9=_\-\.]{66})(?:[\x60'"\s;]|\\[nr]|$)'''
entropy = 2
keywords = ["sg."]

[[rules]]
id = "mailgun-private-api-token"
description = "Mailgun Private API Token"
regex = '''(?i)[\w.-]{0,50}?(?:mailgun)(?:[ \t\w.-]{0,20})[\s'"]{0,3}(?:=|>|:{1,3}=|\|\||:|=>|\?=|,)[\x60'"\s=]{0,5}(key-[a-f0-9]{32})(?:[\x60'"\s;]|\\[nr]|$)'''
keywords = ["mailgun"]

[[rules]]
id = "mailchimp-api-key"
description = "Mailchimp API Key"
regex = '''(?i)[\w.-]{0,50}?(?:mailchimp)(?:[ \t\w.-]{0,20})[\s'"]{0,3}(?:=|>|:{1,3}=|\|\||:|=>|\?=|,)[\x60'"\s=]{0,5}([a-f0-9]{32}-us\d\d)(?:[\x60'"\s;]|\\[nr]|$)'''
keywords = ["mailchimp"]

[[rules]]
id = "algolia-api-key"
description = "Algolia API Key (search-heavy frontends often ship this client-side — check if it's the admin key vs search-only key)"
regex = '''(?i)[\w.-]{0,50}?(?:algolia)(?:[ \t\w.-]{0,20})[\s'"]{0,3}(?:=|>|:{1,3}=|\|\||:|=>|\?=|,)[\x60'"\s=]{0,5}([a-z0-9]{32})(?:[\x60'"\s;]|\\[nr]|$)'''
keywords = ["algolia"]

[[rules]]
id = "mapbox-api-token"
description = "Mapbox API Token"
regex = '''(?i)[\w.-]{0,50}?(?:mapbox)(?:[ \t\w.-]{0,20})[\s'"]{0,3}(?:=|>|:{1,3}=|\|\||:|=>|\?=|,)[\x60'"\s=]{0,5}(pk\.[a-z0-9]{60}\.[a-z0-9]{22})(?:[\x60'"\s;]|\\[nr]|$)'''
keywords = ["mapbox"]

[[rules]]
id = "intercom-api-key"
description = "Intercom API Token"
regex = '''(?i)[\w.-]{0,50}?(?:intercom)(?:[ \t\w.-]{0,20})[\s'"]{0,3}(?:=|>|:{1,3}=|\|\||:|=>|\?=|,)[\x60'"\s=]{0,5}([a-z0-9=_\-]{60})(?:[\x60'"\s;]|\\[nr]|$)'''
keywords = ["intercom"]

[[rules]]
id = "sentry-access-token"
description = "Sentry Access Token"
regex = '''(?i)[\w.-]{0,50}?(?:sentry)(?:[ \t\w.-]{0,20})[\s'"]{0,3}(?:=|>|:{1,3}=|\|\||:|=>|\?=|,)[\x60'"\s=]{0,5}([a-f0-9]{64})(?:[\x60'"\s;]|\\[nr]|$)'''
entropy = 3
keywords = ["sentry"]

[[rules]]
id = "new-relic-browser-api-token"
description = "New Relic Browser Ingest Key (this one is meant to be public-facing, but flag it for review anyway)"
regex = '''(?i)[\w.-]{0,50}?(?:new-relic|newrelic|new_relic)(?:[ \t\w.-]{0,20})[\s'"]{0,3}(?:=|>|:{1,3}=|\|\||:|=>|\?=|,)[\x60'"\s=]{0,5}(NRJS-[a-f0-9]{19})(?:[\x60'"\s;]|\\[nr]|$)'''
keywords = ["nrjs-"]

# ---------------------------------------------------------------------
# Dev platforms / CI tokens that leak into bundled config
# ---------------------------------------------------------------------

[[rules]]
id = "github-pat"
description = "GitHub Personal Access Token"
regex = '''ghp_[0-9a-zA-Z]{36}'''
entropy = 3
keywords = ["ghp_"]

[[rules]]
id = "github-fine-grained-pat"
description = "GitHub Fine-Grained Personal Access Token"
regex = '''github_pat_\w{82}'''
entropy = 3
keywords = ["github_pat_"]

[[rules]]
id = "npm-access-token"
description = "npm Access Token"
regex = '''(?i)\b(npm_[a-z0-9]{36})(?:[\x60'"\s;]|\\[nr]|$)'''
entropy = 2
keywords = ["npm_"]

[[rules]]
id = "heroku-api-key"
description = "Heroku API Key"
regex = '''(?i)[\w.-]{0,50}?(?:heroku)(?:[ \t\w.-]{0,20})[\s'"]{0,3}(?:=|>|:{1,3}=|\|\||:|=>|\?=|,)[\x60'"\s=]{0,5}([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(?:[\x60'"\s;]|\\[nr]|$)'''
keywords = ["heroku"]

# ---------------------------------------------------------------------
# AI / LLM API keys (increasingly common in JS demos and internal tools)
# ---------------------------------------------------------------------

[[rules]]
id = "openai-api-key"
description = "OpenAI API Key"
regex = '''\b(sk-(?:proj|svcacct|admin)-(?:[A-Za-z0-9_-]{74}|[A-Za-z0-9_-]{58})T3BlbkFJ(?:[A-Za-z0-9_-]{74}|[A-Za-z0-9_-]{58})\b|sk-[a-zA-Z0-9]{20}T3BlbkFJ[a-zA-Z0-9]{20})(?:[\x60'"\s;]|\\[nr]|$)'''
entropy = 3
keywords = ["t3blbkfj"]

[[rules]]
id = "anthropic-api-key"
description = "Anthropic API Key"
regex = '''\b(sk-ant-api03-[a-zA-Z0-9_\-]{93}AA)(?:[\x60'"\s;]|\\[nr]|$)'''
keywords = ["sk-ant-api03"]

[[rules]]
id = "huggingface-access-token"
description = "Hugging Face Access Token"
regex = '''\b(hf_(?i:[a-z]{34}))(?:[\x60'"\s;]|\\[nr]|$)'''
entropy = 2
keywords = ["hf_"]

# ---------------------------------------------------------------------
# Social / auth
# ---------------------------------------------------------------------

[[rules]]
id = "facebook-access-token"
description = "Facebook Access Token"
regex = '''(?i)\b(\d{15,16}(\||%)[0-9a-z\-_]{27,40})(?:[\x60'"\s;]|\\[nr]|$)'''
entropy = 3
keywords = ["facebook"]

[[rules]]
id = "discord-client-secret"
description = "Discord Client Secret"
regex = '''(?i)[\w.-]{0,50}?(?:discord)(?:[ \t\w.-]{0,20})[\s'"]{0,3}(?:=|>|:{1,3}=|\|\||:|=>|\?=|,)[\x60'"\s=]{0,5}([a-z0-9=_\-]{32})(?:[\x60'"\s;]|\\[nr]|$)'''
entropy = 2
keywords = ["discord"]

# ---------------------------------------------------------------------
# Interesting URLs (not secrets themselves, but high-signal endpoints
# worth flagging alongside them — internal infra, storage buckets,
# staging environments that shouldn't be reachable from a public bundle)
# ---------------------------------------------------------------------

[[rules]]
id = "s3-bucket-url"
description = "AWS S3 bucket URL — check if the bucket is publicly listable/writable"
regex = '''\b[a-z0-9.-]+\.s3(?:[.-][a-z0-9-]+)?\.amazonaws\.com\b|\bs3://[a-z0-9.-]+\b'''
keywords = ["s3.amazonaws.com", "s3://"]
tags = ["link", "cloud-storage"]

[[rules]]
id = "gcs-bucket-url"
description = "Google Cloud Storage bucket URL"
regex = '''\b[a-z0-9.-]+\.storage\.googleapis\.com\b|\bstorage\.googleapis\.com/[a-z0-9.-]+\b'''
keywords = ["storage.googleapis.com"]
tags = ["link", "cloud-storage"]

[[rules]]
id = "internal-ip-address"
description = "Private/internal IP address hardcoded in JS (RFC1918 ranges + localhost) — suggests leftover dev/debug config"
regex = '''\b(?:127\.0\.0\.1|10\.(?:\d{1,3}\.){2}\d{1,3}|172\.(?:1[6-9]|2\d|3[01])\.(?:\d{1,3}\.)\d{1,3}|192\.168\.(?:\d{1,3}\.)\d{1,3})\b'''
keywords = ["127.0.0.1", "192.168.", "10.", "172."]
tags = ["link", "internal-infra"]

[[rules]]
id = "internal-staging-subdomain"
description = "Internal/staging/dev subdomain referenced in JS — often has weaker auth than production"
regex = '''https?://(?:[a-z0-9-]+\.)*(?:internal|staging|stage|dev|test|uat|qa|preprod|admin)\.[a-z0-9-]+\.[a-z]{2,}\b'''
keywords = ["internal.", "staging.", "stage.", "dev.", "test.", "uat.", "qa.", "admin."]
tags = ["link", "internal-infra"]

[[rules]]
id = "swagger-graphql-endpoint"
description = "Exposed API schema/introspection endpoint (Swagger/OpenAPI/GraphQL) — useful for mapping the API surface"
regex = '''https?://[^\s'"]+/(?:swagger(?:-ui)?(?:\.json|\.yaml)?|openapi\.json|graphql|__graphql|v\d+/api-docs)\b'''
keywords = ["swagger", "openapi.json", "graphql", "api-docs"]
tags = ["link", "api-surface"]

[[rules]]
id = "js-link-finder"
description = "Generic catch-all for URLs/endpoints/paths referenced in JS — LinkFinder-style broad match, expect noise (mixes real API routes with asset paths)"
regex = '''(?:"|')((?:[a-zA-Z]{1,10}://|//)[^"'/]{1,}\.[a-zA-Z]{2,}[^"']{0,}|/[a-zA-Z0-9_?&=\-#.%]*/[a-zA-Z0-9_?&=\-#.%/]*|[a-zA-Z0-9_\-]{1,}\.(?:php|asp|aspx|jsp|json|action|html|js|txt|xml|yml|yaml|env|config|conf)(?:\?[^"']*)?)(?:"|')'''
keywords = ["http", "://", "/"]
tags = ["link", "generic"]

# ---------------------------------------------------------------------
# Format-based / generic catch-alls
# ---------------------------------------------------------------------

[[rules]]
id = "jwt"
description = "JSON Web Token (check payload — often contains internal claims, sometimes signed with a leaked secret)"
regex = '''\b(ey[a-zA-Z0-9]{17,}\.ey[a-zA-Z0-9\/\\_-]{17,}\.(?:[a-zA-Z0-9\/\\_-]{10,}={0,2})?)(?:[\x60'"\s;]|\\[nr]|$)'''
entropy = 3
keywords = ["ey"]

[[rules]]
id = "private-key"
description = "PEM-format Private Key block"
regex = '''(?i)-----BEGIN[ A-Z0-9_-]{0,100}PRIVATE KEY(?: BLOCK)?-----[\s\S-]{64,}?KEY(?: BLOCK)?-----'''
keywords = ["-----begin"]

[[rules]]
id = "basic-auth-in-url"
description = "Basic auth credentials embedded in a URL"
regex = '''[a-zA-Z]{3,10}://[^/\s:@]{3,20}:[^/\s:@]{3,20}@'''
keywords = ["://"]

[[rules]]
id = "generic-api-key"
description = "Generic API key/secret/token pattern — high recall, high noise. Review hits manually; this is what catches app-specific/custom secrets the named rules above miss."
regex = '''(?i)[\w.-]{0,50}?(?:access|auth|(?-i:[Aa]pi|API)|credential|creds|key|passw(?:or)?d|secret|token)(?:[ \t\w.-]{0,20})[\s'"]{0,3}(?:=|>|:{1,3}=|\|\||:|=>|\?=|,)[\x60'"\s=]{0,5}([\w.=-]{10,150}|[a-z0-9][a-z0-9+/]{11,}={0,3})(?:[\x60'"\s;]|\\[nr]|$)'''
entropy = 3.5
keywords = ["access", "api", "auth", "key", "credential", "creds", "passwd", "password", "secret", "token"]
[[rules.allowlists]]
regexes = ['''^[a-zA-Z_.-]+$''']
stopwords = [
    "example", "placeholder", "yourkey", "xxxxxx", "000000",
    "test", "demo", "sample", "changeme", "password", "todo",
]
